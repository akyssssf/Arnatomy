# SonarQube Cloud — ARnatomy (Next.js)
# Ganti organization/projectKey dengan milikmu di https://sonarcloud.io
sonar.organization=akyssssf
sonar.projectKey=akyssssf_Arnatomy
sonar.projectName=ARnatomy
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,public/**,coverage/**,.next/**,node_modules/**

# Coverage dari Vitest (lcov). Komponen presentasional & penampil WebGL diverifikasi
# lewat browser (bukan unit test), jadi dikecualikan dari perhitungan coverage.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/app/**/page.tsx,src/app/**/layout.tsx,src/app/**/loading.tsx,src/app/**/error.tsx,src/app/not-found.tsx,src/components/**,src/three/**,src/lib/data.ts,src/test/**

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json
