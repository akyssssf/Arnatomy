<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARnatomy</title>
  <meta name="description" content="Prototipe antarmuka ARnatomy untuk pembelajaran anatomi sistem peredaran darah." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231d4ed8'/%3E%3Ctext x='8' y='12' font-family='sans-serif' font-size='11' font-weight='700' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />

  <!-- Tailwind CSS v4 via CDN (tanpa build step) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/style.css" />

  <!-- Peta modul Three.js untuk penampil organ 3D (tanpa bundler) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>

<body class="min-h-full bg-neutral-50 text-neutral-900">
  <a href="#konten-utama" class="tautan-lewati">Lewati ke konten utama</a>

  <!-- Header + navigasi dirender oleh js/layout.js sesuai sesi login -->
  <header id="header-aplikasi" hidden></header>

  <main id="konten-utama" tabindex="-1" class="mx-auto w-full max-w-6xl px-4 pb-16 pt-2 sm:px-6"></main>

  <footer id="footer-aplikasi" hidden></footer>

  <!-- Lapisan overlay: modal (dialog) dan pesan status (aria-live) -->
  <div id="lapisan-modal"></div>
  <div id="wadah-toast"
       class="pointer-events-none fixed inset-x-0 bottom-0 z-50 flex flex-col items-center gap-2 px-4 pb-4"
       role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Script klasik berurutan: data & util dulu, halaman, lalu bootstrap -->
  <script src="js/ikon.js"></script>
  <script src="js/variants.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/svg.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/beranda.js"></script>
  <script src="js/pages/eksplorasi.js"></script>
  <script src="js/pages/asisten.js"></script>
  <script src="js/pages/riwayat.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>

  <!-- Penampil 3D memakai ES module sehingga dijalankan setelah script di atas -->
  <script type="module" src="js/viewer3d.js"></script>
</body>
</html>
